name: E2E

on:
  pull_request:
    branches: [main]

env:
  E2E_BACKEND: supabase
  # The form routes create their clients at import time, so the build needs placeholders.
  # No scenario sends a form yet; the Mailpit and Upstash stand-in tickets replace these.
  NEXT_PUBLIC_RESEND_API_KEY: re_placeholder
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: placeholder

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Start local Supabase
        # Only the services the site uses: database, auth, REST API and storage
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta,mailpit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end suite
        run: yarn e2e

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
