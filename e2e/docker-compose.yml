# Test services the E2E suite needs next to the API. Start with:
#   docker compose -f e2e/docker-compose.yml up -d --wait
name: karatekool-e2e

services:
  # Inbox for every email the API sends under its dev and e2e profiles (SMTP 1025, web UI and API 8025)
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "1025:1025"
      - "8025:8025"
