# Mail goes to a local Mailpit (docker compose in e2e/), whose inbox is at http://localhost:8025
spring:
  mail:
    host: localhost
    port: 1025
    username: ""
    properties:
      mail.smtp.ssl.enable: false

app:
  jwt:
    secret: dev-only-secret-that-is-at-least-32-bytes-long
  auth:
    skip-google-verification: true
    dev-user-email: dev@karatekool.app

# The dev user is an Admin so the calendar can be managed locally
whitelist:
  admins:
    - dev@karatekool.app
