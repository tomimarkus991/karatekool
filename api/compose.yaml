# Own project name: the folder is called 'api' in other repos too, and they would share containers
name: karatekool-api
services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=karatekool'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=karatekool'
    ports:
      - '5433:5432'
